<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos Destacados</title>
    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <section class="destinations-section">
        <div class="section-header">
            <h1>Destinos destacados</h1>
            <p>Explora lugares increíbles para tu próximo viaje.</p>
        </div>

        <div class="cards-container">
            <!-- Tarjeta 1: Torres del Paine -->
            <article class="card">
                <div class="card-image-placeholder">
                    <img src="static/img/torres-del-paine.jfif" alt="Torres del paine">
                </div>
                
                <div class="card-content">
                    <h2>Torres del Paine</h2>
                    <span class="country">Chile</span>
                    <p>Naturaleza y paisajes únicos en la Patagonia.</p>
                    <button class="btn-more">Ver más</button>
                </div>
            </article>

            <!-- Tarjeta 2: Cusco -->
            <article class="card">
                <div class="card-image-placeholder">
                    <img src="static/img/cusco.webp" alt="Cusco">
                </div>
                
                <div class="card-content">
                    <h2>Cusco</h2>
                    <span class="country">Perú</span>
                    <p>Cultura, historia y tradiciones.</p>
                    <button class="btn-more">Ver más</button>
                </div>
            </article>

            <!-- Tarjeta 3: Cancún -->
            <article class="card">
                <div class="card-image-placeholder">
                    <img src="static/img/cancun.webp" alt="Cancún">
                </div>
                
                <div class="card-content">
                    <h2>Cancún</h2>
                    <span class="country">México</span>
                    <p>Playas y descanso frente al mar.</p>
                    <button class="btn-more">Ver más</button>
                </div>
            </article>

            <!-- Tarjeta 4: Madrid -->
            <article class="card">
                <div class="card-image-placeholder">
                    <img src="static/img/madrid.jpg" alt="Madrid">
                </div>
                
                <div class="card-content">
                    <h2>Madrid</h2>
                    <span class="country">España</span>
                    <p>Gastronomía, museos y vida urbana.</p>
                    <button class="btn-more">Ver más</button>
                </div>
            </article>
        </div>
    </section>

    <!-- Enlace al archivo de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
